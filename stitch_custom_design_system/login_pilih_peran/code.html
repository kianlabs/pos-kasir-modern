<body class="bg-canvas text-ink-950 font-body-md min-h-screen flex flex-col items-center justify-center p-4 md:p-6 antialiased selection:bg-ink-200">
<!-- Tablet Shell Layout (1280x800 optimized container) -->
<main class="w-full max-w-[520px] flex flex-col items-center my-auto">
<!-- Header Branding -->
<header class="text-center mb-6">
<div class="inline-flex items-center justify-center gap-2 mb-1.5">
<span class="material-symbols-outlined text-ink-950 text-3xl font-bold" data-icon="point_of_sale">point_of_sale</span>
<h1 class="font-display-hero text-display-hero text-ink-950 tracking-tight leading-none">KRING!</h1>
</div>
<p class="font-body-md text-body-md text-ink-500">Kring! Kasir bunyi, cuan masuk.</p>
</header>
<!-- Main Card Container -->
<div class="w-full bg-surface border border-ink-200 rounded-[20px] p-6 shadow-[0_8px_24px_rgba(0,0,0,0.04)]">
<!-- Role Toggle (Kasir vs Owner) -->
<section aria-label="Pilih Peran" class="grid grid-cols-2 gap-2 p-1.5 bg-ink-100 border border-ink-200 rounded-xl mb-6">
<!-- Kasir Tab (Active) -->
<button class="flex items-center justify-center gap-2 h-12 bg-ink-950 text-surface rounded-lg font-label-lg text-label-lg transition-transform active:scale-[0.98]" id="btnRoleKasir" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="badge">badge</span>
<span>Kasir</span>
</button>
<!-- Owner Tab (Inactive) -->
<button class="flex items-center justify-center gap-2 h-12 bg-transparent text-ink-500 hover:text-ink-950 rounded-lg font-label-lg text-label-lg transition-colors" id="btnRoleOwner" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="admin_panel_settings">admin_panel_settings</span>
<span>Owner</span>
</button>
</section>
<!-- Cashier Selection Dropdown -->
<div class="mb-5">
<label class="block font-label-md text-label-md text-ink-700 mb-2" for="cashierSelect">
          Kasir Bertugas
        </label>
<div class="relative">
<select class="w-full h-12 bg-surface border border-ink-200 rounded-xl px-3.5 pr-10 font-body-md text-body-md text-ink-950 appearance-none focus:outline-none focus:border-ink-950 cursor-pointer" id="cashierSelect">
<option selected="" value="budi">Budi Santoso (Shift Pagi)</option>
<option value="siti">Siti Rahma (Shift Siang)</option>
<option value="agus">Agus Pratama (Shift Malam)</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-ink-700">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- PIN Input Area -->
<div class="mb-6 text-center">
<div class="flex items-center justify-between mb-3 px-1">
<span class="font-label-md text-label-md text-ink-700">Masukkan PIN Kasir (4 Digit)</span>
<span class="font-caption text-caption text-ink-500 flex items-center gap-1">
<span class="material-symbols-outlined text-[15px]" data-icon="lock">lock</span>
            Terenkripsi
          </span>
</div>
<!-- 4-Digit PIN Indicator (Pre-filled 3 digits for high-fidelity state: ● ● ● ○) -->
<div class="flex justify-center items-center gap-4 py-2">
<!-- Digit 1: Filled -->
<div class="pin-dot w-4 h-4 rounded-full bg-ink-950 transition-all duration-150 ring-2 ring-ink-950"></div>
<!-- Digit 2: Filled -->
<div class="pin-dot w-4 h-4 rounded-full bg-ink-950 transition-all duration-150 ring-2 ring-ink-950"></div>
<!-- Digit 3: Filled -->
<div class="pin-dot w-4 h-4 rounded-full bg-ink-950 transition-all duration-150 ring-2 ring-ink-950"></div>
<!-- Digit 4: Empty -->
<div class="pin-dot w-4 h-4 rounded-full bg-ink-100 border border-ink-300 transition-all duration-150"></div>
</div>
</div>
<!-- Tablet Ergonomic Numpad Grid (min touch target 60px) -->
<div class="grid grid-cols-3 gap-2.5 mb-6">
<button class="numpad-key touch-target h-[60px] bg-surface hover:bg-ink-100 active:bg-ink-200 border border-ink-200 rounded-xl font-numeral-lg text-numeral-lg text-ink-950 flex items-center justify-center transition-all duration-100 active:scale-[0.98]" type="button">1</button>
<button class="numpad-key touch-target h-[60px] bg-surface hover:bg-ink-100 active:bg-ink-200 border border-ink-200 rounded-xl font-numeral-lg text-numeral-lg text-ink-950 flex items-center justify-center transition-all duration-100 active:scale-[0.98]" type="button">2</button>
<button class="numpad-key touch-target h-[60px] bg-surface hover:bg-ink-100 active:bg-ink-200 border border-ink-200 rounded-xl font-numeral-lg text-numeral-lg text-ink-950 flex items-center justify-center transition-all duration-100 active:scale-[0.98]" type="button">3</button>
<button class="numpad-key touch-target h-[60px] bg-surface hover:bg-ink-100 active:bg-ink-200 border border-ink-200 rounded-xl font-numeral-lg text-numeral-lg text-ink-950 flex items-center justify-center transition-all duration-100 active:scale-[0.98]" type="button">4</button>
<button class="numpad-key touch-target h-[60px] bg-surface hover:bg-ink-100 active:bg-ink-200 border border-ink-200 rounded-xl font-numeral-lg text-numeral-lg text-ink-950 flex items-center justify-center transition-all duration-100 active:scale-[0.98]" type="button">5</button>
<button class="numpad-key touch-target h-[60px] bg-surface hover:bg-ink-100 active:bg-ink-200 border border-ink-200 rounded-xl font-numeral-lg text-numeral-lg text-ink-950 flex items-center justify-center transition-all duration-100 active:scale-[0.98]" type="button">6</button>
<button class="numpad-key touch-target h-[60px] bg-surface hover:bg-ink-100 active:bg-ink-200 border border-ink-200 rounded-xl font-numeral-lg text-numeral-lg text-ink-950 flex items-center justify-center transition-all duration-100 active:scale-[0.98]" type="button">7</button>
<button class="numpad-key touch-target h-[60px] bg-surface hover:bg-ink-100 active:bg-ink-200 border border-ink-200 rounded-xl font-numeral-lg text-numeral-lg text-ink-950 flex items-center justify-center transition-all duration-100 active:scale-[0.98]" type="button">8</button>
<button class="numpad-key touch-target h-[60px] bg-surface hover:bg-ink-100 active:bg-ink-200 border border-ink-200 rounded-xl font-numeral-lg text-numeral-lg text-ink-950 flex items-center justify-center transition-all duration-100 active:scale-[0.98]" type="button">9</button>
<!-- Clear (C) Key -->
<button class="numpad-key touch-target h-[60px] bg-surface hover:bg-ink-100 active:bg-ink-200 border border-ink-200 rounded-xl font-label-lg text-label-lg text-ink-700 flex items-center justify-center transition-all duration-100 active:scale-[0.98]" id="btnClearPin" type="button">C</button>
<!-- 0 Key -->
<button class="numpad-key touch-target h-[60px] bg-surface hover:bg-ink-100 active:bg-ink-200 border border-ink-200 rounded-xl font-numeral-lg text-numeral-lg text-ink-950 flex items-center justify-center transition-all duration-100 active:scale-[0.98]" type="button">0</button>
<!-- Backspace Key -->
<button class="numpad-key touch-target h-[60px] bg-surface hover:bg-ink-100 active:bg-ink-200 border border-ink-200 rounded-xl text-ink-700 flex items-center justify-center transition-all duration-100 active:scale-[0.98]" id="btnBackspacePin" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="backspace">backspace</span>
</button>
</div>
<!-- Primary Action CTA Button -->
<button class="w-full h-14 bg-ink-950 hover:opacity-90 active:scale-[0.98] text-surface font-headline-sm text-headline-sm rounded-xl flex items-center justify-center gap-2 transition-all shadow-none" id="btnLogin" type="button">
<span>MASUK SEBAGAI KASIR</span>
<span class="material-symbols-outlined text-[22px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Microcopy Help Footer -->
<footer class="mt-5 text-center">
<p class="font-caption text-caption text-ink-500">
        Lupa PIN kasir? Hubungi Owner atau Supervisor outlet.
      </p>
<div class="mt-3 flex items-center justify-center gap-4 text-ink-500 font-caption text-caption">
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="wifi">wifi</span>
          Terminal Terhubung
        </span>
<span>•</span>
<span>Versi POS 2.4.0 (Tablet)</span>
</div>
</footer>
</main>
<!-- Interactive Logic for PIN demonstration -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      let pin = "123"; // starts with 3 digits as requested (● ● ● ○)
      const pinDots = document.querySelectorAll('.pin-dot');
      const numpadKeys = document.querySelectorAll('.numpad-key');
      const btnClear = document.getElementById('btnClearPin');
      const btnBackspace = document.getElementById('btnBackspacePin');
      const cashierSelect = document.getElementById('cashierSelect');
      const loginButton = document.getElementById('btnLogin');
      const btnRoleKasir = document.getElementById('btnRoleKasir');
      const btnRoleOwner = document.getElementById('btnRoleOwner');

      function updateDots() {
        pinDots.forEach((dot, index) => {
          if (index < pin.length) {
            dot.className = "pin-dot w-4 h-4 rounded-full bg-ink-950 transition-all duration-150 ring-2 ring-ink-950";
          } else {
            dot.className = "pin-dot w-4 h-4 rounded-full bg-ink-100 border border-ink-300 transition-all duration-150";
          }
        });
      }

      numpadKeys.forEach(btn => {
        btn.addEventListener('click', (e) => {
          const text = btn.innerText.trim();
          if (text >= '0' && text <= '9') {
            if (pin.length < 4) {
              pin += text;
              updateDots();
            }
          }
        });
      });

      btnClear.addEventListener('click', () => {
        pin = "";
        updateDots();
      });

      btnBackspace.addEventListener('click', () => {
        if (pin.length > 0) {
          pin = pin.slice(0, -1);
          updateDots();
        }
      });

      loginButton.addEventListener('click', () => {
        const kasirName = cashierSelect.options[cashierSelect.selectedIndex].text.split('(')[0].trim();
        if (pin.length < 4) {
          alert(`Silakan lengkapi 4 digit PIN untuk kasir ${kasirName}`);
        } else {
          alert(`Berhasil masuk sebagai ${kasirName}. Membuka register POS KRING!...`);
        }
      });

      btnRoleOwner.addEventListener('click', () => {
        alert("Mengalihkan ke layar masuk Owner KRING!...");
      });
    });
  </script>
</body></html>
